name: Docs

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.161.1
  HUGO_BOOK_SHA: ae912cc38d3f77d928b5c1f8f1a3c0575bf3415a # main as of 2026-04-23 (v13 + deprecation fixes for Hugo 0.156/0.158)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Hugo
        run: |
          curl -sL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin hugo
          hugo version
      - name: Fetch hugo-book theme
        run: |
          mkdir -p docs/themes
          curl -sL "https://github.com/alex-shpak/hugo-book/archive/${HUGO_BOOK_SHA}.tar.gz" \
            | tar -xz -C docs/themes
          mv "docs/themes/hugo-book-${HUGO_BOOK_SHA}" docs/themes/hugo-book
      - name: Stage README and LICENSE into content/
        run: |
          {
            printf -- '---\ntitle: scrive-mcp\ntype: docs\n---\n\n'
            cat README.md
          } > docs/content/_index.md
          {
            printf -- '---\ntitle: License\nweight: 99\n---\n\n```text\n'
            cat LICENSE
            printf '\n```\n'
          } > docs/content/license.md
      - uses: actions/configure-pages@v6
        id: pages
      - name: Build with Hugo
        run: hugo --minify --source docs --baseURL "${{ steps.pages.outputs.base_url }}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
