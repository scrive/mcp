<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Download from Scrive</title>
    <style>
      :root {
        --blue: #1a79cb;
        --darkblue: #274790;
        --lavender: #e9f2fa;
        --black: #27282d;
        --brand: #3e494b;
        --grey1: #f2f6f9;
        --grey2: #d8e1eb;
        --grey3: #97a0aa;
        --grey4: #6a7281;
        --green: #20883e;
        --red: #e00040;
        --white: #ffffff;

        --radius-sm: 4px;
        --radius-md: 8px;

        --space-1: 4px;
        --space-2: 8px;
        --space-3: 16px;
        --space-4: 24px;
        --space-5: 32px;

        --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

        --shadow-card: 0 1px 2px #00000040, 0 8px 24px #00000033;
        --shadow-focus: 0 0 0 3px #1a79cb66;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--black);
        color: var(--black);
        font-family: var(--font);
        font-size: 0.875rem;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        width: min(28rem, calc(100vw - var(--space-3)));
        background: var(--white);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-card);
        padding: var(--space-4);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-3);
      }

      .download-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-2);
        width: 100%;
        padding: var(--space-3);
        border: none;
        border-radius: var(--radius-sm);
        background: var(--blue);
        color: var(--white);
        font-family: var(--font);
        font-size: 0.9375rem;
        font-weight: 600;
        cursor: pointer;
        transition:
          background-color 120ms ease,
          box-shadow 120ms ease;
      }

      .download-btn:hover:not(:disabled) {
        background: var(--darkblue);
      }

      .download-btn:focus-visible {
        outline: none;
        box-shadow: var(--shadow-focus);
      }

      .download-btn .icon {
        width: 20px;
        height: 20px;
      }

      #error {
        width: 100%;
        padding: var(--space-2) var(--space-3);
        border-radius: var(--radius-sm);
        font-size: 0.8125rem;
        line-height: 1.45;
        white-space: pre-wrap;
        background: #fbe6ec;
        color: var(--red);
        border: 1px solid #f4c2d0;
      }

      #error:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <button id="download-btn" class="download-btn" type="button">
        <svg
          class="icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12 4v11" />
          <path d="m7 10 5 5 5-5" />
          <path d="M5 19h14" />
        </svg>
        Download PDF
      </button>
      <div id="error" aria-live="polite"></div>
    </main>
    <script type="module" src="./src/app.ts"></script>
  </body>
</html>
