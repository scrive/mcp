<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Get Time</title>
    <style>
      :root {
        color-scheme: light;
        --surface: #f4f1e8;
        --panel: #fff8ec;
        --ink: #1d1a15;
        --accent: #c45f31;
        --accent-strong: #9f451e;
        --shadow: rgba(55, 35, 18, 0.15);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(196, 95, 49, 0.18), transparent 30%),
          linear-gradient(180deg, #f7f0e4, var(--surface));
        color: var(--ink);
        font-family: "Iowan Old Style", "Palatino Linotype", serif;
      }

      .card {
        width: min(28rem, calc(100vw - 2rem));
        padding: 2rem;
        border-radius: 1.5rem;
        background: var(--panel);
        box-shadow: 0 24px 60px var(--shadow);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 5vw, 2.8rem);
      }

      p {
        margin: 0;
        line-height: 1.6;
      }

      code {
        display: block;
        margin: 1.5rem 0;
        padding: 1rem 1.25rem;
        border-radius: 1rem;
        background: rgba(29, 26, 21, 0.08);
        font-size: 1.1rem;
        overflow-wrap: anywhere;
      }

      button {
        border: none;
        border-radius: 999px;
        padding: 0.9rem 1.4rem;
        background: var(--accent);
        color: white;
        font: inherit;
        cursor: pointer;
        transition:
          transform 120ms ease,
          background 120ms ease;
      }

      button:hover {
        background: var(--accent-strong);
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p>Server Time</p>
      <h1>UTC</h1>
      <code id="time">Waiting for tool result...</code>
      <button id="refresh" type="button">Refresh</button>
    </main>
    <script type="module" src="./src/app.ts"></script>
  </body>
</html>
